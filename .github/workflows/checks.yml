name: Checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -s tests -v
      - run: node --check plugin/public/portal.js
      - run: bash -n ops/server-deploy.sh ops/preview-server.sh ops/setup-preview.sh ops/test-server.sh
      - name: Check tracked files
        run: python ops/check_release.py
  ruby-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - run: find plugin -name '*.rb' -print0 | xargs -0 -n1 ruby -c
  discourse-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      RAILS_ENV: test
      RAILS_DB: handraw_web_test
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
      DISCOURSE_DB_HOST: 127.0.0.1
      DISCOURSE_DB_USERNAME: postgres
      DISCOURSE_DB_PASSWORD: postgres
      DISCOURSE_REDIS_DB: 13
      LOAD_PLUGINS: 1
      BUNDLE_IGNORE_CONFIG: 1
      HANDRAW_PRIVATE_STORAGE: /tmp/handraw-test-private
    steps:
      - uses: actions/checkout@v4
        with:
          path: web
      - uses: actions/checkout@v4
        with:
          repository: yang0/discourse
          ref: f3758bd5a691a1fd8fb92f3fdbf1a22ec86650ac
          path: discourse
      - run: cp -R web/plugin discourse/plugins/handraw-community
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.7'
          bundler-cache: true
          working-directory: discourse
      - uses: pnpm/action-setup@v4
        with:
          version: '12.11.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked asset processor dependencies
        working-directory: discourse
        run: pnpm install --frozen-lockfile
      - name: Prepare disposable database
        working-directory: discourse
        run: bin/rake db:create db:schema:load db:migrate
      - name: Exercise requests and business rules
        working-directory: discourse
        run: bin/rspec plugins/handraw-community/spec
      - name: Exercise real concurrent transactions
        working-directory: discourse
        run: bin/rails runner ../web/ops/concurrency-check.rb
