name: Checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-v3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  interaction-journey-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check demo/assets/task-journey.js && node --check demo/assets/studio-app.js && node --check demo/assets/studio-batch.js
      - run: node --check demo/assets/studio-canvas-ui.js && node tests/test_studio_canvas_ui_129.cjs
      - run: node --check demo/assets/studio-core.js && node --check demo/assets/studio-app.js && node tests/test_studio_runtime_119.cjs
      - run: node --check demo/assets/studio-dag-scheduler-120.js && node tests/test_studio_dag_scheduler_120.cjs
      - run: node --check demo/assets/studio-make-image.js && node --check demo/assets/studio-make-image-versions.js && node tests/test_studio_make_image_versions.cjs && node tests/test_studio_make_image_ui_128.cjs
      - run: node --check demo/assets/studio-series-board-108.js && node --check demo/assets/studio-batch.js && node tests/test_studio_series_ui_108.cjs
      - run: node --check demo/assets/studio-article-project-109.js && node tests/test_studio_article_project_109.cjs
      - run: node tests/test_task_journey.cjs
      - run: node --check demo/assets/article-generation-guard.js && node tests/test_article_generation_guard.cjs
      - run: node --check demo/assets/article-review.js && node tests/test_article_review.cjs
      - run: python -m unittest discover -s tests -p 'test_article_versions.py' -v
      - run: python -m unittest discover -s tests -p 'test_studio_workflow_versions.py' -v
      - run: python -m unittest discover -s tests -p 'test_studio_image_plan.py' -v
      - run: python -m unittest discover -s tests -p 'test_studio_run_read.py' -v
      - run: python -m unittest discover -s tests -p 'test_studio_runtime_119.py' -v
      - run: python -m unittest discover -s tests -p 'test_studio_quick_run_contract.py' -v
      - run: python -m unittest discover -s tests -p 'test_studio_series_run_contract.py' -v
      - run: python -m unittest discover -s tests -p 'test_studio_series_reference_preflight.py' -v
      - run: python -m unittest discover -s tests -p 'test_studio_cancel_pending.py' -v
      - run: python -m unittest discover -s tests -p 'test_studio_projects.py' -v
      - run: python -m unittest discover -s tests -p 'test_studio_view_authority.py' -v
      - run: python -m unittest discover -s tests -p 'test_studio_article_integration.py' -v
      # This HTTP journey goes through login -> curation bootstrap, which
      # imports Pillow; lighter unit tests above deliberately avoid it.
      - run: python -m pip install "Pillow>=10.0"
      - run: python -m unittest discover -s tests -p 'test_studio_runtime_http_119.py' -v
      - run: python -m unittest discover -s tests -p 'test_studio_article_http_e2e.py' -v
      - run: python -m unittest discover -s tests -p 'test_studio_ai_plan.py' -v
      - run: python -m unittest discover -s tests -p 'test_studio_ai_plan_http.py' -v
      - run: python -m unittest discover -s tests -p 'test_studio_resource_refs.py' -v
      - run: python -m unittest discover -s tests -p 'test_studio_security_negative_112.py' -v
      - run: python -m unittest discover -s tests -p 'test_studio_plan_slot_access.py' -v
      - run: python -m unittest discover -s tests -p 'test_studio_project_http.py' -v
      - run: python -m unittest discover -s tests -p 'test_studio_project_pagination.py' -v
      - run: python -m unittest discover -s tests -p 'test_pg_studio_project_migration.py' -v
      # #127: use actual installed Chrome on the GitHub runner. Capture
      # first render/drag+zoom frame p95/DOM/heap/IME focus at 10–300 nodes.
      - run: python -m pip install "playwright>=1.50,<2"
      - run: python tests/smoke_studio_article_browser_109.py
      - run: python tests/smoke_studio_picker_browser_105.py
      - run: python tests/smoke_studio_project_reliability_103.py
      - run: python tests/smoke_studio_series_browser_108.py
      - run: python tests/benchmark_studio_canvas.py --output artifacts/canvas-127.json --require-browser
      - run: python tests/smoke_studio_canvas_browser.py --screenshots artifacts/canvas-127-screen
      - name: '#112 Native Studio 100-node Graph + owner isolation Chromium smoke'
        run: python tests/smoke_studio_native_100_graph_112.py
      - run: python tests/smoke_studio_runtime_browser_119.py
      - run: python tests/smoke_studio_make_image_browser_128.py
      - run: python tests/smoke_studio_navigation_projects_106.py
      - run: python tests/smoke_studio_dag_browser_120.py
      - name: '#112 M0-M3 acceptance matrix and CI wiring guard'
        run: python ops/check_studio_acceptance_112.py --output artifacts/studio-112-matrix.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio2-canvas-127-benchmark
          path: |
            artifacts/canvas-127.json
            artifacts/studio-112-matrix.json
            artifacts/studio-112-100-node/**
            artifacts/canvas-127-screen/**
            artifacts/canvas-119-screen/**
            artifacts/quick-128-screen/**
            artifacts/series-108-screen/**
            artifacts/project-103-screen/**
            artifacts/article-109-screen/**
            artifacts/navigation-106-screen/**
            artifacts/dag-120-screen/**
          if-no-files-found: ignore
  # Keep the complete unittest suite, but run each module on exactly one
  # worker. Historical timings balance slow HTTP/integration modules.
  python-full:
    name: python-full (shard ${{ matrix.shard }} / 6)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Full Python unittest suite (balanced shard)
        run: python ops/ci_python_shard.py --shards 6 --shard ${{ matrix.shard }}

  # A stable single check for PR rules. No shard can fail unnoticed.
  python-full-suite:
    if: always()
    needs: [python-full]
    runs-on: ubuntu-latest
    steps:
      - name: Require every full-suite shard to pass
        run: test "${{ needs.python-full.result }}" = "success"

  # Node/bash/release checks run concurrently with the Python matrix.
  # Preserve the old job name for any existing branch protection rules.
  portable-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check demo/assets/cloud-center.js
      - run: node --check demo/assets/error-boundary.js && node tests/test_error_boundary.cjs
      - run: node --check demo/assets/task-journey.js && node tests/test_task_journey.cjs
      - run: node --check plugin/public/portal.js
      - run: node --check plugin/public/discover.js && node --check plugin/public/composer-bridge.js && node --check plugin/public/gallery-refinement.js
      - run: node --check plugin/public/market.js && node --check plugin/public/forum-experience.js
      - run: node tests/test_share_preview.cjs
      - run: node tests/test_masonry_flow.cjs
      - run: node --check demo/assets/mixed-feed.js && node tests/test_mixed_feed.cjs
      - run: node --check demo/assets/image-loader.js && node tests/test_main_image_loader.cjs
      - run: node tests/test_forum_navigation.cjs
      - run: node --check plugin/public/studio.js && node tests/test_studio_command.cjs && node tests/test_studio_pager.cjs
      - run: node --check plugin/public/image-loader.js && node tests/test_image_loader.cjs
      - run: bash -n ops/server-deploy.sh ops/preview-server.sh ops/setup-preview.sh ops/test-server.sh
      - name: Check tracked files
        run: python3 ops/check_release.py
  feed-ui-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check demo/assets/main-app.js && node --check demo/assets/mixed-feed.js && node --check demo/assets/image-loader.js
      - run: node tests/test_mixed_feed.cjs && node tests/test_main_image_loader.cjs && node tests/test_progressive_image_loader.cjs && node tests/test_masonry_flow.cjs && node tests/test_profile_studio_p2_p3.cjs && node tests/test_studio_history_masonry.cjs && node tests/test_forum_work_assets.cjs && node tests/test_image_asset_detail.cjs && node tests/test_work_fork_hydration.cjs && node tests/test_fork_subject_single_field.cjs
      - name: Private gallery, batch parallel UI and progress regression
        run: |
          node --check demo/assets/cloud-center.js
          node --check demo/assets/studio-batch.js
          node --check demo/assets/studio-app.js
          node --check demo/assets/studio-make-image.js
          node --check demo/assets/studio-core.js
          node tests/test_studio_core.cjs
          node --check demo/assets/studio-normalization.js
          node tests/test_studio_normalization.cjs
          node --check demo/assets/studio-quick-spec.js
          node tests/test_studio_make_image_integration.cjs
          node --check demo/assets/studio-series-plan.js
          node tests/test_studio_series_plan_integration.cjs
          node --check demo/assets/studio-canvas-renderer.js
          node tests/test_studio_canvas_incremental.cjs
          node tests/test_studio_views.cjs
          node --check demo/assets/studio-views.js
          node tests/test_studio_view_authority.cjs
          node --check demo/assets/studio-article-integration.js
          node tests/test_studio_article_integration.cjs
          node --check demo/assets/studio-ai-plan.js
          node tests/test_studio_ai_plan.cjs
          node tests/test_studio_workflow_autosave.cjs
          node tests/test_studio_workflow_delete.cjs
          node --check demo/assets/studio-project-sync.js
          node tests/test_studio_project_sync.cjs
          node --check demo/assets/studio-project-center.js
          node tests/test_studio_project_center.cjs
          node --check demo/assets/studio-resources.js
          node tests/test_studio_resources.cjs
          node --check demo/assets/studio-article-picker-105.js
          node tests/test_studio_article_picker_105.cjs
          node tests/test_studio_project_center_ime.cjs
          node tests/test_studio_closed_project.cjs
          node tests/test_studio_picker_interactions.cjs
          node tests/test_quick_stale_generation.cjs
          node tests/test_profile_private_gallery.cjs
          node tests/test_profile_masonry_parity.cjs
          node tests/test_profile_masonry_flow.cjs
          node tests/test_studio_batch.cjs
          node tests/test_batch_progress_incremental.cjs
          node tests/test_batch_concurrency_contract.cjs
          node tests/test_batch_stop.cjs
  progressive-thumb-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_progressive_thumbnails.py' -v
  account-identity-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_account_identity.py' -v
      - run: python -m unittest discover -s tests -p 'test_v2_account_features.py' -v
      - run: python -m unittest discover -s tests -p 'test_p2_growth_oauth.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check demo/assets/shared.js && node --check demo/assets/main-app.js && node --check demo/assets/forum-app.js
      - run: node tests/test_account_settings_navigation.cjs
      - run: node tests/test_p2_account_ui.cjs
      - run: node --check demo/assets/account-tools.js && node --check demo/assets/studio-app.js && node --check demo/assets/studio-batch.js
  v3-core-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Canonical run, single-work feed, Skill and history contracts
        run: |
          python -m unittest discover -s tests -p 'test_generation_v3.py' -v
          python -m unittest discover -s tests -p 'test_stage5_plaza_batch_folding.py' -v
          python -m unittest discover -s tests -p 'test_skill_web_bridge.py' -v
          python -m unittest discover -s tests -p 'test_profile_generation_history.py' -v
          python -m unittest discover -s tests -p 'test_stage3_backfill_and_filtering.py' -v

  production-storage-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: handraw_pg_staging
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d handraw_pg_staging" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HANDRAW_PG_STAGING_URL: postgresql://postgres:postgres@127.0.0.1:5432/handraw_pg_staging
      HANDRAW_PG_PARITY_TEST: 'YES'
      HANDRAW_REDIS_URL: redis://127.0.0.1:6379/0
      HANDRAW_REDIS_PREFIX: handraw:ci
      HANDRAW_REDIS_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_production_storage.py' -v
