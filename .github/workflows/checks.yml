name: Checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -s tests -v
      - run: node --check plugin/public/portal.js
      - run: node --check plugin/public/discover.js && node --check plugin/public/composer-bridge.js && node --check plugin/public/gallery-refinement.js
      - run: node --check plugin/public/market.js && node --check plugin/public/forum-experience.js
      - run: node tests/test_share_preview.cjs
      - run: node tests/test_masonry_flow.cjs
      - run: node --check demo/assets/mixed-feed.js && node tests/test_mixed_feed.cjs
      - run: node --check demo/assets/image-loader.js && node tests/test_main_image_loader.cjs
      - run: node tests/test_forum_navigation.cjs
      - run: node --check plugin/public/studio.js && node tests/test_studio_command.cjs && node tests/test_studio_pager.cjs
      - run: node --check plugin/public/image-loader.js && node tests/test_image_loader.cjs
      - run: bash -n ops/server-deploy.sh ops/preview-server.sh ops/setup-preview.sh ops/test-server.sh
      - name: Check tracked files
        run: python ops/check_release.py
  feed-ui-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check demo/assets/main-app.js && node --check demo/assets/mixed-feed.js && node --check demo/assets/image-loader.js
      - run: node tests/test_mixed_feed.cjs && node tests/test_main_image_loader.cjs && node tests/test_progressive_image_loader.cjs && node tests/test_masonry_flow.cjs
  progressive-thumb-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_progressive_thumbnails.py' -v
  account-identity-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_account_identity.py' -v
      - run: python -m unittest discover -s tests -p 'test_v2_account_features.py' -v
      - run: python -m unittest discover -s tests -p 'test_p2_growth_oauth.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check demo/assets/shared.js && node --check demo/assets/main-app.js && node --check demo/assets/forum-app.js
      - run: node tests/test_account_settings_navigation.cjs
      - run: node --check demo/assets/account-tools.js && node --check demo/assets/studio-app.js && node --check demo/assets/studio-batch.js
  ruby-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - run: find plugin -name '*.rb' -print0 | xargs -0 -n1 ruby -c
  discourse-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      RAILS_ENV: test
      RAILS_DB: handraw_web_test
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
      DISCOURSE_DB_HOST: 127.0.0.1
      DISCOURSE_DB_USERNAME: postgres
      DISCOURSE_DB_PASSWORD: postgres
      DISCOURSE_REDIS_DB: 13
      LOAD_PLUGINS: 1
      BUNDLE_IGNORE_CONFIG: 1
      HANDRAW_PRIVATE_STORAGE: /tmp/handraw-test-private
    steps:
      - uses: actions/checkout@v4
        with:
          path: web
      - uses: actions/checkout@v4
        with:
          repository: yang0/discourse
          ref: f3758bd5a691a1fd8fb92f3fdbf1a22ec86650ac
          path: discourse
      - run: cp -R web/plugin discourse/plugins/handraw-community
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.7'
          bundler-cache: true
          working-directory: discourse
      - uses: pnpm/action-setup@v4
        with:
          version: '12.11.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked asset processor dependencies
        working-directory: discourse
        run: pnpm install --frozen-lockfile
      - name: Prepare disposable database
        working-directory: discourse
        run: bin/rake db:create db:schema:load db:migrate
      - name: Exercise requests and business rules
        working-directory: discourse
        run: bin/rspec plugins/handraw-community/spec
      - name: Exercise real concurrent transactions
        working-directory: discourse
        run: bin/rails runner ../web/ops/concurrency-check.rb
