name: Checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-v3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  interaction-journey-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: handraw_pg_staging
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d handraw_pg_staging" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HANDRAW_PG_STAGING_URL: postgresql://postgres:postgres@127.0.0.1:5432/handraw_pg_staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check demo/assets/task-journey.js && node --check demo/assets/studio-app.js && node --check demo/assets/studio-batch.js
      - run: node tests/test_task_journey.cjs
      - run: node --check demo/assets/article-generation-guard.js && node tests/test_article_generation_guard.cjs
      - run: node --check demo/assets/article-review.js && node tests/test_article_review.cjs
      - run: node tests/test_article_blocks.cjs && node tests/test_article_replanning.cjs && node tests/test_studio_generate_pending.cjs && node tests/test_parameter_canvas.cjs && node tests/test_v2_studio_state.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_article_versions.py' -v
  # Keep the complete unittest suite, but run each module on exactly one
  # worker. Historical timings balance slow HTTP/integration modules.
  python-full:
    name: python-full (shard ${{ matrix.shard }} / 6)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: handraw_pg_staging
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d handraw_pg_staging" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HANDRAW_REDIS_URL: redis://127.0.0.1:6379/0
      HANDRAW_REDIS_PREFIX: handraw:ci
      HANDRAW_PG_STAGING_URL: postgresql://postgres:postgres@127.0.0.1:5432/handraw_pg_staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Full Python unittest suite (balanced shard)
        run: python ops/ci_python_shard.py --shards 6 --shard ${{ matrix.shard }}

  # A stable single check for PR rules. No shard can fail unnoticed.
  python-full-suite:
    if: always()
    needs: [python-full]
    runs-on: ubuntu-latest
    steps:
      - name: Require every full-suite shard to pass
        run: test "${{ needs.python-full.result }}" = "success"

  # Node/bash/release checks run concurrently with the Python matrix.
  # Preserve the old job name for any existing branch protection rules.
  portable-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check demo/assets/cloud-center.js
      - run: node --check demo/assets/error-boundary.js && node tests/test_error_boundary.cjs
      - run: node --check demo/assets/task-journey.js && node tests/test_task_journey.cjs
      - run: node --check plugin/public/portal.js
      - run: node --check plugin/public/discover.js && node --check plugin/public/composer-bridge.js && node --check plugin/public/gallery-refinement.js
      - run: node --check plugin/public/market.js && node --check plugin/public/forum-experience.js
      - run: node tests/test_share_preview.cjs
      - run: node tests/test_masonry_flow.cjs
      - run: node --check demo/assets/mixed-feed.js && node tests/test_mixed_feed.cjs
      - run: node --check demo/assets/image-loader.js && node tests/test_main_image_loader.cjs
      - run: node tests/test_forum_navigation.cjs
      - run: node --check plugin/public/studio.js && node tests/test_studio_command.cjs && node tests/test_studio_pager.cjs
      - run: node --check plugin/public/image-loader.js && node tests/test_image_loader.cjs
      - run: bash -n ops/server-deploy.sh ops/preview-server.sh ops/setup-preview.sh ops/test-server.sh
      - name: Check tracked files
        run: python3 ops/check_release.py
  feed-ui-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check demo/assets/main-app.js && node --check demo/assets/mixed-feed.js && node --check demo/assets/image-loader.js
      - run: node --check demo/assets/forum-app.js && node --check demo/assets/admin-app.js && node tests/test_forum_featured_sidebar.cjs
      - run: node tests/test_mixed_feed.cjs && node tests/test_main_image_loader.cjs && node tests/test_progressive_image_loader.cjs && node tests/test_masonry_flow.cjs && node tests/test_profile_studio_p2_p3.cjs && node tests/test_studio_history_masonry.cjs && node tests/test_forum_work_assets.cjs && node tests/test_image_asset_detail.cjs && node tests/test_work_fork_hydration.cjs && node tests/test_fork_subject_single_field.cjs
      - name: Private gallery, batch parallel UI and progress regression
        run: |
          node --check demo/assets/cloud-center.js
          node --check demo/assets/studio-batch.js
          node --check demo/assets/studio-app.js
          node --check demo/assets/studio-make-image.js
          node tests/test_studio_picker_interactions.cjs
          node tests/test_quick_stale_generation.cjs
          node tests/test_profile_private_gallery.cjs
          node tests/test_profile_masonry_parity.cjs
          node tests/test_profile_masonry_flow.cjs
          node tests/test_studio_batch.cjs
          node tests/test_batch_progress_incremental.cjs
          node tests/test_batch_concurrency_contract.cjs
          node tests/test_batch_stop.cjs
  progressive-thumb-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_progressive_thumbnails.py' -v
  account-identity-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: handraw_pg_staging
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d handraw_pg_staging" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HANDRAW_PG_STAGING_URL: postgresql://postgres:postgres@127.0.0.1:5432/handraw_pg_staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_account_identity.py' -v
      - run: python -m unittest discover -s tests -p 'test_v2_account_features.py' -v
      - run: python -m unittest discover -s tests -p 'test_p2_growth_oauth.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check demo/assets/shared.js && node --check demo/assets/main-app.js && node --check demo/assets/forum-app.js
      - run: node tests/test_account_settings_navigation.cjs
      - run: node tests/test_p2_account_ui.cjs
      - run: node --check demo/assets/account-tools.js && node --check demo/assets/studio-app.js && node --check demo/assets/studio-batch.js
  v3-core-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: handraw_pg_staging
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d handraw_pg_staging" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HANDRAW_PG_STAGING_URL: postgresql://postgres:postgres@127.0.0.1:5432/handraw_pg_staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Canonical run, single-work feed, Skill and history contracts
        run: |
          python -m unittest discover -s tests -p 'test_generation_v3.py' -v
          python -m unittest discover -s tests -p 'test_stage5_plaza_batch_folding.py' -v
          python -m unittest discover -s tests -p 'test_skill_web_bridge.py' -v
          python -m unittest discover -s tests -p 'test_profile_generation_history.py' -v
          python -m unittest discover -s tests -p 'test_stage3_backfill_and_filtering.py' -v

  production-storage-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: handraw_pg_staging
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d handraw_pg_staging" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HANDRAW_PG_STAGING_URL: postgresql://postgres:postgres@127.0.0.1:5432/handraw_pg_staging
      HANDRAW_REDIS_URL: redis://127.0.0.1:6379/0
      HANDRAW_REDIS_PREFIX: handraw:ci
      HANDRAW_REDIS_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo '/usr/lib/postgresql/16/bin' >> "$GITHUB_PATH"
      - run: >-
          python -m unittest -v tests.test_production_storage tests.test_home_scenarios_postgres
          tests.test_discourse_import tests.test_resource_redirect_transactions tests.test_postgres_operations
          tests.test_social_counters_postgres tests.test_v2_operations tests.test_ops_convergence tests.test_cold_start
          tests.test_home_scenarios tests.test_unified_replies tests.test_resource_topic_visibility
          tests.test_round4_fixes tests.test_seed_starter_library
          tests.test_v2_single_backend tests.test_collection_canonical_response
          tests.test_comment_led_forum tests.test_cover_image
          tests.test_article_plan tests.test_batch_plan tests.test_batch_size_mismatch
          tests.test_direct_messages tests.test_message_broadcasts tests.test_admin_user_delete_foreign_keys
          tests.test_works_feed tests.test_works_feed_cache

  creation-workspace-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: handraw_pg_staging
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d handraw_pg_staging" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HANDRAW_PG_STAGING_URL: postgresql://postgres:postgres@127.0.0.1:5432/handraw_pg_staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/verify_creation_workspace_browser.py
      - run: python -m unittest -v tests.test_browser_render tests.test_series_single_resize_browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creation-workspace-browser
          path: /tmp/handraw-creation-workspace/
