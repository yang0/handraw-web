<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="发现手绘风作品，分享创作经验，把喜欢的画风与图型带进自己的创作。"
    />
    <title>手绘风 · 创作与分享</title>
    <link rel="stylesheet" href="/studio/assets/navigation.css" />
    <link rel="stylesheet" href="/studio/assets/portal.css" />
    <script src="/studio/assets/portal.js" defer></script>
  </head>
  <body>
    <a class="hw-skip" href="#main">跳转到内容</a>
    <!-- handraw-navigation -->
    <main id="main" tabindex="-1">
      <section class="hw-hero" id="hero" aria-labelledby="hero-title">
        <div
          class="hw-hero__image"
          role="img"
          aria-label="官方画风库的手绘创作示例"
        ></div>
        <div class="hw-hero__copy">
          <p class="hw-eyebrow">创作有回响，灵感有出处</p>
          <h1 id="hero-title">手绘风<span>把灵感，画出来。</span></h1>
          <p class="hw-hero__intro">
            晒一张作品，分享一个方法，或找到下一次创作的画风。
          </p>
          <div class="hw-actions">
            <button class="hw-button" id="share">开始分享 <span>↗</span></button
            ><a
              class="hw-text-link"
              href="/studio?view=resources"
              data-view="resources"
              >探索画风与图型 →</a
            >
          </div>
        </div>
        <a
          class="hw-hero__credit"
          href="https://static.handraw-style.com/gallery/index.html?web=2"
          >画风来自官方资源库 ↗</a
        >
      </section>
      <section class="hw-workspace">
        <div class="hw-section-heading">
          <div>
            <p class="hw-eyebrow" id="section-label">COMMUNITY / 社区发现</p>
            <h2 id="section-title">作品与经验</h2>
          </div>
          <div class="hw-heading-actions" id="heading-actions"></div>
        </div>
        <div id="toolbar" class="hw-toolbar"></div>
        <p id="notice" class="hw-notice" role="status"></p>
        <div id="content" class="hw-content">
          <p class="hw-empty">正在加载创作…</p>
        </div>
        <button class="hw-button hw-button--quiet" id="more" hidden>
          继续发现 ↓
        </button>
      </section>
      <section class="hw-discussions" id="discussions-section">
        <div class="hw-section-heading">
          <h2>社区正在聊</h2>
          <a class="hw-text-link" href="/latest">进入论坛 →</a>
        </div>
        <ul id="discussions"></ul>
      </section>
    </main>
    <footer class="hw-footer">
      <a class="hw-brand" href="/studio">手绘风</a>
      <p>每一次分享，都让下一次创作更容易。</p>
      <a
        href="https://github.com/yang0/handraw-style"
        target="_blank"
        rel="noopener noreferrer"
        >开源 Skill ↗</a
      ><a href="/guidelines">社区准则</a><span id="release"></span>
    </footer>
    <dialog id="modal" class="hw-modal" aria-labelledby="modal-title">
      <div class="hw-modal__heading">
        <h2 id="modal-title"></h2>
        <button class="hw-close" id="close-modal" aria-label="关闭">×</button>
      </div>
      <div id="modal-body"></div>
    </dialog>
  </body>
</html>
