<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="探索视觉画风、图型与配色，组合创作指令，分享自己的作品。"
    />
    <title>手绘风 · 找到喜欢的画风</title>
    <link rel="stylesheet" href="/studio/assets/navigation.css" />
    <link rel="stylesheet" href="/studio/assets/portal.css" />
    <link rel="stylesheet" href="/studio/assets/market.css" />
    <link rel="stylesheet" href="/studio/assets/studio.css" />
    <script src="/studio/assets/image-loader.js" defer></script>
    <script src="/studio/assets/market.js" defer></script>
    <script src="/studio/assets/composer-core.js" defer></script>
    <script src="/studio/assets/studio.js" defer></script>
    <script src="/studio/assets/discover.js" defer></script>
    <script src="/studio/assets/portal.js" defer></script>
  </head>
  <body>
    <a class="hw-skip" href="#main">跳转到内容</a>
    <!-- handraw-navigation -->
    <main id="main" tabindex="-1">
      <section
        class="hw-hero hw-home-hero"
        id="hero"
        aria-labelledby="hero-title"
      >
        <div class="hw-hero__copy">
          <p class="hw-eyebrow">HANDRAW · 为每一个想创作的人</p>
          <h1 id="hero-title">找到喜欢的画风，<br /><em>把想法画出来。</em></h1>
          <p class="hw-hero__intro" id="home-intro">
            从画风、图型与配色开始，找到适合你的视觉表达。
          </p>
          <div class="hw-actions">
            <a class="hw-button" href="/studio?view=explore" data-view="explore"
              >探索画风与图型 <span aria-hidden="true">↗</span></a
            >
            <a
              class="hw-button hw-button--quiet"
              href="/studio?view=create"
              data-view="create"
              >打开创作台</a
            >
          </div>
          <form class="hw-home-search" id="home-search" action="/studio">
            <input type="hidden" name="view" value="explore" />
            <label class="hw-sr-only" for="home-query"
              >搜索画风名称、编号或关键词</label
            >
            <input
              id="home-query"
              name="q"
              type="search"
              placeholder="水彩、国风，或 FA-001"
              maxlength="100"
            />
            <button type="submit" aria-label="搜索画风">
              搜索 <span aria-hidden="true">→</span>
            </button>
          </form>
          <p class="hw-hero-note">免费浏览 · 无需记编号 · 从一个想法开始</p>
        </div>
        <div class="hw-hero-art" aria-label="官方画风示例">
          <a
            class="hw-hero-art__main"
            href="/studio?view=explore&amp;id=FB-006"
            data-view="explore"
            ><img
              data-hw-src="https://img.handraw-style.com/images/individual/FB/FB-006.webp"
              alt="奇妙绘本画风示例 FB-006"
              width="420"
              height="520"
            /><span>画风不止一种，表达也可以。</span></a
          >
          <a
            class="hw-hero-art__detail"
            href="/studio?view=explore&amp;id=FI-032"
            data-view="explore"
            ><img
              data-hw-src="https://img.handraw-style.com/images/individual/FI/FI-032.webp"
              alt="生活随拍画风示例 FI-032"
              width="220"
              height="260"
            /><span>也可以，像生活一样自然。</span></a
          >
          <span class="hw-art-note">来自官方画风库的真实示例</span>
        </div>
      </section>
      <div id="home-sections"></div>
      <section class="hw-workspace">
        <div class="hw-section-heading">
          <div>
            <p class="hw-eyebrow" id="section-label">COMMUNITY / 社区发现</p>
            <h2 id="section-title">作品与经验</h2>
          </div>
          <div class="hw-heading-actions" id="heading-actions"></div>
        </div>
        <div id="toolbar" class="hw-toolbar"></div>
        <p id="notice" class="hw-notice" role="status"></p>
        <div id="content" class="hw-content">
          <p class="hw-empty">正在加载创作…</p>
        </div>
        <button class="hw-button hw-button--quiet" id="more" hidden>
          继续发现 ↓
        </button>
      </section>
      <section class="hw-discussions" id="discussions-section">
        <div class="hw-section-heading">
          <h2>社区正在聊</h2>
          <a class="hw-text-link" href="/latest">进入论坛 →</a>
        </div>
        <ul id="discussions"></ul>
      </section>
    </main>
    <footer class="hw-footer">
      <a class="hw-brand" href="/studio">手绘风</a>
      <p>找到画风，开始创作，让灵感彼此连接。</p>
      <a
        href="https://github.com/yang0/handraw-style"
        target="_blank"
        rel="noopener noreferrer"
        >开源 Skill ↗</a
      ><a href="/guidelines">社区准则</a><span id="release"></span>
    </footer>
    <dialog id="modal" class="hw-modal" aria-labelledby="modal-title">
      <div class="hw-modal__heading">
        <h2 id="modal-title"></h2>
        <button class="hw-close" id="close-modal" aria-label="关闭">×</button>
      </div>
      <div id="modal-body"></div>
    </dialog>
  </body>
</html>
